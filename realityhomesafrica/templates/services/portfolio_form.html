{% extends 'base.html' %}
{% block title %}Add Portfolio Item{% endblock %}
{% block content %}
<div style="max-width:520px; margin:0 auto;">
  <h1 style="font-family:'Playfair Display',serif; font-size:1.8rem; margin-bottom:1.5rem;">Add Portfolio Item</h1>
  <div style="background:var(--white); border-radius:var(--radius); padding:2rem; box-shadow:var(--shadow);">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label>{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<p class="form-error">{{ error }}</p>{% endfor %}
        </div>
      {% endfor %}
      <div style="display:flex; gap:0.75rem;">
        <button type="submit" class="btn btn-primary">Save Item</button>
        <a href="{% url 'services:tradesman_dashboard' %}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
